<style>__FONTS__</style>
<style>
:root {
  --paper: #f2f1ee; --ink: #2c2b28; --dim: #6e6d68; --faint: #98978f;
  --gold: #d99a2b; --rule: #d6d4cd; --card: #e9e6de;
  --disp: 'Barlow Condensed', 'Arial Narrow', sans-serif;
  --body: 'Inter', -apple-system, sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.65; }

nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 30; height: 50px;
  display: flex; align-items: center; justify-content: center; gap: 28px;
  background: rgba(16,16,20,.9); backdrop-filter: blur(10px);
  font-family: var(--disp); font-size: 15px; letter-spacing: .16em; text-transform: uppercase;
}
nav a { color: rgba(255,255,255,.76); text-decoration: none; }
nav a:hover, nav a.on { color: var(--gold); }

/* flat band, no banner image: this page is opened on a phone in a session room, so it stays light */
.band { background: #14110b; padding: 94px 2rem 40px; text-align: center; }
.band h1 {
  margin: 0; font-family: var(--disp); font-weight: 200; color: #fff;
  font-size: clamp(38px, 8vw, 76px); letter-spacing: .17em; text-transform: uppercase; padding-left: .17em;
}
.band p { margin: .5rem 0 0; color: #9d9c96; font-size: 14px; }

.wrap { max-width: 860px; margin: 0 auto; padding: 2.4rem 2rem 3.4rem; }
.lede { color: var(--dim); margin: 0 0 2.2rem; }

.event { margin-bottom: 3rem; }
.event h2 {
  font-family: var(--disp); font-weight: 400; font-size: clamp(26px, 5vw, 38px);
  letter-spacing: .07em; text-transform: uppercase; margin: 0 0 .25rem; color: #43423d;
}
.emeta {
  font-family: var(--disp); font-size: 16px; letter-spacing: .09em; text-transform: uppercase;
  color: var(--faint); margin: 0 0 1.4rem; padding-bottom: 1rem; border-bottom: 1px solid var(--rule);
}

.app { background: var(--card); border: 1px solid #d9d5cb; border-radius: 3px; padding: 1.1rem 1.2rem; margin-bottom: 1rem; }
.ahead { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: .55rem; }
.role {
  font-family: var(--disp); font-size: 13px; letter-spacing: .14em; text-transform: uppercase;
  padding: 2px 10px; border: 1px solid #c0a97f; border-radius: 2px; color: #8a6410;
}
.when { font-family: var(--disp); font-size: 15px; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); }
.sess { font-size: 13px; color: var(--faint); }
.atitle { font-size: 16px; font-weight: 500; line-height: 1.42; margin: 0; }
.atitle a { color: inherit; text-decoration: none; border-bottom: 1px solid rgba(44,43,40,.25); }
.atitle a:hover { border-color: var(--gold); }
.au { color: var(--dim); font-size: 14px; margin-top: .25rem; }

/* the whole point of the page: a thumb-sized download, one-handed, in a session room */
.dl {
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  min-height: 50px; margin-top: .9rem; padding: 0 22px;
  background: #fbfbf9; border: 1px solid #c0a97f; border-radius: 3px;
  font-family: var(--disp); font-size: 17px; letter-spacing: .13em; text-transform: uppercase;
  color: #8a6410; text-decoration: none; -webkit-tap-highlight-color: rgba(217,154,43,.25);
}
.dl:hover, .dl:active { background: rgba(217,154,43,.12); border-color: var(--gold); color: #6d4f0c; }
.dl svg { flex: none; }
.dl .size { font-family: var(--body); font-size: 12px; letter-spacing: .02em; text-transform: none; color: var(--faint); }
.noslides { margin-top: .9rem; font-size: 13px; color: var(--faint); }

footer { background: var(--card); border-top: 1px solid #d9d5cb; color: var(--dim); padding: 2.6rem 2rem; text-align: center; font-size: 13.5px; }
footer a { color: var(--gold); text-decoration: none; }

@media (max-width: 640px) {
  nav { gap: 16px; font-size: 13px; }
  .band { padding: 82px 1.1rem 30px; }
  .wrap { padding: 1.8rem 1.1rem 2.6rem; }
  .app { padding: 1rem; }
  .dl { display: flex; width: 100%; min-height: 56px; font-size: 18px; }
}
</style>
</head>
