<style>
:root { --gold: #d99a2b; --disp: 'Barlow Condensed', 'Arial Narrow', sans-serif; --body: 'Inter', -apple-system, sans-serif; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: #0b0b0f; color: #fff; font-family: var(--body); overflow: hidden; }

nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 30; height: 50px;
  display: flex; align-items: center; justify-content: center; gap: 30px;
  font-family: var(--disp); font-size: 15px; letter-spacing: .16em; text-transform: uppercase;
}
nav a { color: rgba(255,255,255,.72); text-decoration: none; }
nav a:hover, nav a.on { color: var(--gold); }

.photo {
  position: fixed; top: 0; right: 0; bottom: 0; width: 62%; z-index: 0; pointer-events: none;
  background-image: url(__PORTRAIT__);
  background-repeat: no-repeat; background-position: 52% 10%; background-size: cover;
  -webkit-mask-image: linear-gradient(90deg, transparent 0%, rgba(0,0,0,.22) 26%, rgba(0,0,0,.72) 58%, #000 88%);
  mask-image: linear-gradient(90deg, transparent 0%, rgba(0,0,0,.22) 26%, rgba(0,0,0,.72) 58%, #000 88%);
}
.veil {
  position: fixed; inset: 0; z-index: 1; pointer-events: none;
  background:
    linear-gradient(100deg, #0b0b0f 0%, rgba(11,11,15,.9) 30%, rgba(11,11,15,.42) 52%, rgba(11,11,15,.08) 76%, rgba(11,11,15,.12) 100%),
    linear-gradient(180deg, rgba(11,11,15,.7) 0%, rgba(11,11,15,0) 22%, rgba(11,11,15,0) 68%, rgba(11,11,15,.85) 100%);
}

main {
  position: relative; z-index: 3; height: 100%;
  display: flex; flex-direction: column; justify-content: center;
  max-width: 1180px; margin: 0 auto; padding: 0 2.5rem;
}
h1 {
  font-family: var(--disp); font-weight: 200; margin: 0 0 1.5rem;
  font-size: clamp(50px, 9.5vw, 118px); line-height: .92; letter-spacing: .1em; text-transform: uppercase;
}
.roles { margin-bottom: 1.7rem; }
.role { font-family: var(--disp); text-transform: uppercase; letter-spacing: .09em; line-height: 1.42; margin-bottom: .95rem; }
.role b { display: block; font-weight: 400; font-size: clamp(16px, 1.95vw, 22px); color: #f0efea; }
.role span { display: block; font-weight: 300; font-size: clamp(14px, 1.55vw, 17.5px); color: #9d9c96; }
.study {
  max-width: 555px; font-size: clamp(14.5px, 1.4vw, 16.5px); line-height: 1.78; color: #c4c3bd;
  border-left: 2px solid rgba(217,154,43,.5); padding-left: 1.3rem; margin: 0;
}
.links { margin-top: 2.2rem; display: flex; flex-wrap: wrap; gap: 22px; font-size: 13.5px; }
.links a { color: var(--gold); text-decoration: none; border-bottom: 1px solid rgba(217,154,43,.28); padding-bottom: 2px; }
.links a:hover { border-color: var(--gold); }

.stats { margin-top: 1.9rem; display: flex; flex-wrap: wrap; gap: 12px 34px; }
.stat { text-decoration: none; color: inherit; }
.stat b { display: block; font-family: var(--disp); font-weight: 300; font-size: clamp(24px, 2.6vw, 32px); letter-spacing: .04em; color: #f0efea; line-height: 1.1; }
.stat span { display: block; font-family: var(--disp); font-size: 12.5px; letter-spacing: .14em; text-transform: uppercase; color: #9d9c96; margin-top: 3px; }
.stat:hover b { color: var(--gold); }
.stats .asof { align-self: flex-end; font-size: 11.5px; color: #6f6e69; padding-bottom: 4px; }

.enter { position: fixed; bottom: 32px; left: 0; right: 0; z-index: 4; display: flex; justify-content: center; gap: clamp(26px, 7vw, 86px); }
.enter a { color: rgba(255,255,255,.78); text-decoration: none; text-align: center;
  font-family: var(--disp); font-size: 14px; letter-spacing: .12em; text-transform: uppercase; }
.enter a:hover { color: var(--gold); }
.enter svg { display: block; margin: 0 auto 6px; }

@media (max-width: 900px) {
    .photo { width: 100%; background-position: 52% 6%; background-size: cover;
    -webkit-mask-image: linear-gradient(180deg, #000 0%, rgba(0,0,0,.5) 58%, transparent 80%);
    mask-image: linear-gradient(180deg, #000 0%, rgba(0,0,0,.5) 58%, transparent 80%); }
  .veil { background: linear-gradient(180deg, rgba(11,11,15,.62) 0%, rgba(11,11,15,.86) 42%, rgba(11,11,15,.95) 70%); }
}
@media (max-width: 640px) { nav { gap: 16px; font-size: 13px; } .enter { gap: 20px; bottom: 22px; } .study { padding-left: 1rem; } }
/* short viewports: keep the stat row clear of the bottom nav; give main a bottom inset for the enter bar */
main { padding-bottom: 96px; }
@media (max-height: 760px) {
  h1 { margin-bottom: 1rem; font-size: clamp(44px, 8vw, 96px); }
  .roles { margin-bottom: 1.1rem; } .role { margin-bottom: .6rem; }
  .study { font-size: 14.5px; line-height: 1.6; }
  .links { margin-top: 1.4rem; } .stats { margin-top: 1.2rem; } .stat b { font-size: 24px; }
}
@media (max-height: 640px) { .stats { display: none; } }
</style>
</head>
